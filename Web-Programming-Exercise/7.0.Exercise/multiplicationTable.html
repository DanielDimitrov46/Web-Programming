<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблица за умножение</title>
    <style>
        /* Стил за таблицата */
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }

        /* Стил за клетките */
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        /* Стил за заглавната клетка */
        th {
            background-color: #f4f4f4;
            padding: 10px;
        }
    </style>
</head>
<body>
<h1>Таблица за умножение</h1>

<!-- Формуляр за избор на число и цвят -->
<label for="number">Изберете число:</label>
<input type="number" id="number" value="1" min="1" max="10">
<br><br>

<label for="color">Изберете цвят:</label>
<input type="color" id="color" value="#f4f4f4">
<br><br>

<button onclick="generateTable()">Генерирай таблица</button>

<div id="tableContainer"></div>

<script>
    // Функция за генериране на таблица за умножение
    function generateTable() {
        // Вземаме стойностите от формите
        const number = document.getElementById("number").value;
        const color = document.getElementById("color").value;

        // Създаваме таблица
        let tableHTML = "<table>";
        tableHTML += "<thead><tr><th>Число</th><th>Резултат</th></tr></thead><tbody>";

        // Запълваме таблицата с умножения
        for (let i = 1; i <= 10; i++) {
            const result = number * i;
            tableHTML += `<tr style="background-color: ${color};"><td>${number} x ${i}</td><td>${result}</td></tr>`;
        }

        tableHTML += "</tbody></table>";

        // Показваме таблицата в div
        document.getElementById("tableContainer").innerHTML = tableHTML;
    }
</script>
</body>
</html>
